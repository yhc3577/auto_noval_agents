version: "3.8"

services:
  # ── Backend (FastAPI) ────────────────────────────────
  backend:
    image: ${DOCKER_REGISTRY}novel-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novel-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # MongoDB
      MONGODB_URL: ${MONGODB_URL:-mongodb://host.docker.internal:27017}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-novel_db}
      # Redis
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379}
      # JWT
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-random-secret-key}
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      # LLM (从 .env 读取)
      LLM_PROVIDER: ${LLM_PROVIDER:-vllm}
      LLM_API_KEY: ${LLM_API_KEY:-EMPTY}
      LLM_MODEL: ${LLM_MODEL:-Qwen/Qwen2.5-72B-Instruct}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://localhost:8000/v1}
      # FAISS
      FAISS_INDEX_PATH: /app/faiss_indexes
      # LangSmith (可选)
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      # 服务端口
      SERVER_PORT: "8080"
    volumes:
      - faiss_data:/app/faiss_indexes
    ports:
      - "8080:8080"
    networks:
      - novel-net

  # ── Frontend (Nginx + Vue) ──────────────────────────
  frontend:
    image: ${DOCKER_REGISTRY}novel-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: novel-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - novel-net

volumes:
  faiss_data:

networks:
  novel-net:
    driver: bridge
